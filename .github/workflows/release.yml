# The only pipeline of @athenos/webcomponents: it runs on a tag v* (pushed
# by fenrir infra/release/release.sh) or by hand, never on an ordinary push,
# pull request or schedule (GitHub Actions minutes are scarce).
#
#   gates             lint (shared config, ESLint, Stylelint, i18n, tsc,
#                     a11y, tokens:check, Prettier, knip), token pipeline
#                     tests, unit tests (with and without zone.js),
#                     build:lib, dist/ matches the build, npm audit
#                     --audit-level=high (it replaces the former
#                     security.yml).
#   catalogue-a11y    Storybook build + axe on every story (Linux).
#   release           on a tag: `npm pack` of the package
#                     (athenos-webcomponents-<version>.tgz) and SHA256SUMS on
#                     the GitHub release of the tag. Nothing is published to
#                     an npm registry: athenos-web takes the library as a git
#                     dependency pinned to a commit.
#
# The screenshot comparison (macOS baselines, `npm run test:storybook`) is
# not part of this pipeline: macOS runner minutes count tenfold, so it runs
# locally before a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Angular 22 needs Node ^22.22.3 or ^24.15 (W4-A; Storybook 10 >= 22.12).
  NODE_VERSION: '24.15.0'
  CI: 'true'

jobs:
  gates:
    name: lint, unit tests, tokens, build:lib, npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (shared config, ESLint, Stylelint, i18n, tsc, a11y, tokens:check, Prettier, knip)
        run: npm run lint
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      - name: Token pipeline tests
        run: npm run test:tokens
      # Vitest in browser mode (W5-B): headless Chromium through Playwright,
      # the version @playwright/test pins.
      - name: Install Chromium for the unit tests
        run: npx playwright install --with-deps --only-shell chromium
      - name: Unit tests
        run: npx ng test --watch=false
      # The same specs without zone.js (quality step 4.1): a component that
      # only updates because zone.js ticked fails here.
      - name: Unit tests (zoneless)
        run: npm run test:zoneless -- --watch=false
      - name: Build library
        run: npm run build:lib
      # Git installs ship the committed dist/ and never build (package.json
      # has no build/prepare/install scripts), so dist/ must be exactly what
      # the sources build to, and every entry point the root package.json
      # names must exist in it. Locally: npm run check:dist.
      - name: dist/ matches the build, entry points exist, no install-time scripts
        run: node scripts/check-package.mjs --dist

  # axe on every story in light and dark. Platform independent, so Linux.
  catalogue-a11y:
    name: Storybook build + axe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: axe on every story (violations not in a11y-baseline.json fail)
        run: npm run test:storybook
        env:
          SB_VISUAL: 'off'
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-a11y-report
          path: test-results/
          retention-days: 14

  release:
    name: GitHub release
    needs: [gates, catalogue-a11y]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release create/upload, only in the publish step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          for f in package.json projects/athenos-webcomponents/package.json dist/athenos-webcomponents/package.json; do
            v=$(jq -r .version "$f")
            [ "$v" = "$version" ] ||
              { echo "::error::tag $GITHUB_REF_NAME, but $f says $v (release with fenrir infra/release/release.sh)"; exit 1; }
          done
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || { echo "::error::not X.Y.Z-N: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The committed dist/ is what git installs get (the gates checked it
      # matches the sources); pack it without running any script.
      - name: Pack
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha256sum -- *.tgz > SHA256SUMS && cat SHA256SUMS)
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "athenos-webcomponents $TAG" \
              --notes "npm pack of @athenos/webcomponents at $GITHUB_SHA. athenos-web pins this commit. Verify with: sha256sum -c SHA256SUMS" ||
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*.tgz release/SHA256SUMS
