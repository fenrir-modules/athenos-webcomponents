<div
  class="ath-textarea"
  [class.ath-textarea--error]="error()"
  [class.ath-textarea--disabled]="isDisabled()"
>
  @if (label()) {
    <label class="ath-textarea__label" [for]="textareaId()">
      {{ label() }}
      @if (required()) {
        <span class="ath-textarea__required">*</span>
      }
    </label>
  }

  <textarea
    [id]="textareaId()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [attr.aria-required]="required() || null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [value]="fieldValue()"
    [attr.maxlength]="maxLength()"
    [style.resize]="resize()"
    (input)="onInput($event)"
    (blur)="onTouched()"
    class="ath-textarea__field"
  ></textarea>

  <div class="ath-textarea__meta">
    @if (error()) {
      <div class="ath-textarea__error" [id]="errorId()">
        <ath-icon [img]="alertIcon" [size]="14" />
        {{ error() }}
      </div>
    } @else if (hint()) {
      <div class="ath-textarea__hint" [id]="hintId()">{{ hint() }}</div>
    } @else {
      <div></div>
    }

    @if (maxLength()) {
      <div class="ath-textarea__count" [class.ath-textarea__count--near-limit]="nearLimit()">
        {{ characterCount() }}/{{ maxLength() }}
      </div>
    }
  </div>
</div>
